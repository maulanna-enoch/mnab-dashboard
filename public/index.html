<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MNAB</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
<meta name="theme-color" content="#0f1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="MNAB" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<script src="/shared/pwa.js"></script>
<link rel="stylesheet" href="/shared/transaction-form.css" />
<link rel="stylesheet" href="/shared/responsive.css" />
<link rel="stylesheet" href="/shared/bottom-nav.css" />
<link rel="stylesheet" href="/shared/push.css" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #f4f4f5;
    --muted: #9ca3af;
    --accent: #22c55e;
    --paid: #e24b4a;
    --billed: #f5b942;
    --unbilled: #60a5fa;
    --negative: #e24b4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px calc(140px + env(safe-area-inset-bottom));
  }
  .app-title {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 16px 0 20px;
    text-align: center;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 16px;
    text-align: center;
  }
  /* "Cash Flow" heading row; also holds the Notifications bell (shared/push.js),
     pinned to the content column's right edge so the centered title stays put. */
  .home-heading {
    position: relative;
    width: 100%;
    max-width: var(--page-max-width);
  }
  .home-heading .psh-bell { position: absolute; right: 0; top: -9px; }
  select#month {
    width: 100%;
    max-width: var(--page-max-width);
    background: var(--card);
    color: var(--text);
    border: 1px solid #374151;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .card {
    width: 100%;
    max-width: var(--page-max-width);
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 12px;
    text-align: center;
  }
  .label {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .hero-total {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--accent);
    word-break: break-word;
  }
  .hero-unit {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
    margin-top: 2px;
  }
  .toggle-row {
    display: flex;
    gap: 8px;
    margin: 14px auto 0;
    max-width: 260px;
  }
  .toggle-btn {
    flex: 1;
    padding: 8px;
    border-radius: 999px;
    border: 1px solid #374151;
    background: var(--bg);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .toggle-btn.active {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(34, 197, 94, 0.12);
  }
  .section-total {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 10px;
  }
  .sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 8px;
  }
  .error {
    color: #f87171;
    font-size: 0.9rem;
  }
  .refresh {
    background: none;
    border: 1px solid #374151;
    color: var(--text);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
  }
  .bar {
    display: flex;
    height: 14px;
    border-radius: 7px;
    overflow: hidden;
    background: var(--bg);
    margin-bottom: 10px;
  }
  .bar-paid { background: var(--paid); }
  .bar-billed { background: var(--billed); }
  .bar-unbilled { background: var(--unbilled); }
  .legend {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .legend .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 4px;
  }
  details {
    border-top: 1px solid #2a2e37;
    padding-top: 8px;
    text-align: left;
  }
  summary {
    cursor: pointer;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }
  .item-list {
    list-style: none;
    margin: 8px 0 0;
    padding: 0;
  }
  .item-list li {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    padding: 4px 0;
    color: var(--text);
  }
  .item-list li span:last-child {
    color: var(--muted);
  }
  .item-list li.paid span:last-child { color: var(--text); }
  .item-list li.billed span:last-child { color: var(--billed); }
  .item-list li.unbilled span:last-child { color: var(--unbilled); }
  .item-list li.category-header {
    display: block;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 10px 0 2px;
    border-top: 1px solid #2a2e37;
  }
  .item-list li.category-header:first-child {
    border-top: none;
    padding-top: 0;
  }
  /* Float card (apps-script/FloatPlan.gs via /api/cashflow-summary?action=float) */
  .flt-bar {
    position: relative;
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
    background: var(--bg);
    margin: 12px 0 8px;
  }
  .flt-bar-fill { height: 100%; background: var(--accent); width: 0; }
  .flt-bar-fill.over { background: var(--negative); }
  .flt-figures {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .flt-goal { font-size: 0.9rem; color: var(--text); margin-bottom: 4px; }
  .item-list li .flt-status { font-size: 0.75rem; color: var(--muted); }
  .item-list li.flt-under .flt-status { color: var(--accent); }
  .item-list li.flt-over .flt-status { color: var(--negative); }
  .item-list li.flt-current span:first-child { font-weight: 600; }
</style>
</head>
<body>
  <div class="app-title">MNAB · Maulanna Needs A Budget</div>
  <div class="home-heading">
    <h1>Cash Flow</h1>
    <button type="button" class="psh-bell" id="psh-bell" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
  </div>

  <select id="month"></select>

  <div class="card">
    <div class="label">Left to spend</div>
    <div class="hero-total" id="left-total">Loading…</div>
    <div class="hero-unit" id="left-unit"></div>

    <div class="toggle-row" id="modeToggle">
      <button class="toggle-btn active" data-mode="total">Total</button>
      <button class="toggle-btn" data-mode="perday">Per day</button>
    </div>

    <div class="sub" id="left-meta"></div>
  </div>

  <div class="card" id="flt-card">
    <div class="label">Credit card float</div>
    <div class="section-total" id="flt-hero">Loading…</div>
    <div class="sub" id="flt-hero-sub"></div>
    <div id="flt-body" hidden>
      <div class="flt-bar"><div class="flt-bar-fill" id="flt-bar-fill"></div></div>
      <div class="flt-figures">
        <span id="flt-spent"></span>
        <span id="flt-cap"></span>
      </div>
      <div class="flt-goal" id="flt-goal"></div>
      <div class="sub" id="flt-plan"></div>
      <details>
        <summary>Month by month</summary>
        <ul class="item-list" id="flt-months"></ul>
      </details>
    </div>
  </div>

  <div class="card">
    <div class="label">Income</div>
    <div class="section-total" id="income-total">Loading…</div>
    <details>
      <summary>View line items</summary>
      <ul class="item-list" id="income-items"></ul>
    </details>
  </div>

  <div class="card">
    <div class="label">Outflow</div>
    <div class="section-total" id="outflow-total">Loading…</div>
    <div class="bar">
      <div class="bar-paid" id="bar-paid"></div>
      <div class="bar-billed" id="bar-billed"></div>
      <div class="bar-unbilled" id="bar-unbilled"></div>
    </div>
    <div class="legend">
      <span><span class="dot" style="background: var(--paid);"></span>Paid</span>
      <span><span class="dot" style="background: var(--billed);"></span>Billed</span>
      <span><span class="dot" style="background: var(--unbilled);"></span>Unbilled</span>
    </div>
    <details>
      <summary>View line items</summary>
      <ul class="item-list" id="outflow-items"></ul>
    </details>
  </div>

  <button class="refresh" onclick="loadSummary(true); loadFloat(true)">Refresh</button>

  <div id="txf-root"></div>
  <div id="bnv-root"></div>

  <script src="/shared/modal-a11y.js"></script>
  <script src="/shared/transaction-form.js"></script>
  <script src="/shared/bottom-nav.js"></script>
  <script src="/shared/keyboard-nav.js"></script>
  <script src="/shared/push.js"></script>
  <script>
    function formatIDR(value) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0,
      }).format(value);
    }

    // ---- "Left to spend" per-day math ----
    // Divides the current "left to spend" total by the number of days
    // between today and the 25th (payroll day) of whichever month is being
    // viewed -- e.g. viewing August on the 19th gives 6 days (19th -> 25th
    // of August); viewing September on the same day gives 37 days (19th
    // Aug -> 25th Sep). Always measured from *today*, not the 1st of the
    // viewed month.
    const PAYROLL_DAY = 25;
    let mode = 'total'; // 'total' | 'perday'
    let lastSummary = null; // last-loaded /api/cashflow-summary payload, so toggling doesn't refetch

    function dayLabel(d) {
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function daysBetween(a, b) {
      const MS_PER_DAY = 24 * 60 * 60 * 1000;
      const aMid = new Date(a.getFullYear(), a.getMonth(), a.getDate());
      const bMid = new Date(b.getFullYear(), b.getMonth(), b.getDate());
      return Math.round((bMid - aMid) / MS_PER_DAY);
    }

    // Payroll date for the viewed month is always THAT month's 25th, no
    // matter how far off it is. If that date has already passed relative
    // to today (e.g. viewing the current month after the 25th), roll
    // forward to next month's 25th instead -- a payroll date in the past
    // isn't a useful divisor.
    function payrollDateFor(viewedYear, viewedMonthIndex, today) {
      let payroll = new Date(viewedYear, viewedMonthIndex, PAYROLL_DAY);
      let rolledForward = false;
      if (payroll < new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
        payroll = new Date(viewedYear, viewedMonthIndex + 1, PAYROLL_DAY);
        rolledForward = true;
      }
      return { payroll, rolledForward };
    }

    function renderLeftToSpend() {
      if (!lastSummary) return;
      const data = lastSummary;
      const leftTotalEl = document.getElementById('left-total');
      const leftUnitEl = document.getElementById('left-unit');
      const leftMetaEl = document.getElementById('left-meta');

      if (mode === 'total') {
        leftTotalEl.textContent = formatIDR(data.leftToSpend);
        leftTotalEl.style.color = data.leftToSpend >= 0 ? 'var(--accent)' : 'var(--negative)';
        leftUnitEl.textContent = '';
        leftMetaEl.textContent = `updated ${new Date(data.updatedAt).toLocaleTimeString()}`;
        return;
      }

      // Per-day mode
      const [yearStr, monthStr] = data.month.split('-');
      const viewedYear = Number(yearStr);
      const viewedMonthIndex = Number(monthStr) - 1;
      const today = new Date();
      const { payroll, rolledForward } = payrollDateFor(viewedYear, viewedMonthIndex, today);
      const days = Math.max(1, daysBetween(today, payroll));

      // Already overspent (negative left-to-spend) -> nothing left to
      // divide up, so per-day floors at zero instead of showing a
      // negative daily "allowance" that doesn't mean anything in practice.
      const isOverspent = data.leftToSpend < 0;
      const perDay = isOverspent ? 0 : data.leftToSpend / days;

      leftTotalEl.textContent = formatIDR(Math.round(perDay));
      leftTotalEl.style.color = perDay > 0 ? 'var(--accent)' : 'var(--negative)';
      leftUnitEl.textContent = '/ day';
      leftMetaEl.innerHTML =
        (isOverspent
          ? `Already ${formatIDR(Math.abs(data.leftToSpend))} over for this month &mdash; nothing left to spend per day`
          : `${formatIDR(data.leftToSpend)} over ${days} day(s) &mdash; ${dayLabel(today)} &rarr; ${dayLabel(payroll)} (payroll)`) +
        (rolledForward ? '<br><span style="color:var(--muted);">25th of the viewed month already passed &mdash; rolled to next payroll</span>' : '');
    }

    document.querySelectorAll('#modeToggle .toggle-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        mode = btn.dataset.mode;
        document.querySelectorAll('#modeToggle .toggle-btn').forEach((b) => b.classList.toggle('active', b === btn));
        renderLeftToSpend();
      });
    });

    async function loadMonths() {
      const monthEl = document.getElementById('month');
      try {
        const res = await fetch('/api/cashflow-summary?action=months');
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        if (!data.months.length) {
          monthEl.innerHTML = '<option value="">No months found in Diary</option>';
          return;
        }
        monthEl.innerHTML = data.months.map((m) => `<option value="${m.value}">${m.label}</option>`).join('');
        loadSummary();
      } catch (err) {
        monthEl.innerHTML = '<option value="">Error loading months</option>';
        document.getElementById('left-total').textContent = '—';
        document.getElementById('left-meta').innerHTML = `<span class="error">${err.message}</span>`;
      }
    }

    async function loadSummary(forceFresh) {
      const monthEl = document.getElementById('month');
      const month = monthEl.value;
      if (!month) return;

      const leftTotalEl = document.getElementById('left-total');
      const leftMetaEl = document.getElementById('left-meta');
      const incomeTotalEl = document.getElementById('income-total');
      const incomeItemsEl = document.getElementById('income-items');
      const outflowTotalEl = document.getElementById('outflow-total');
      const outflowItemsEl = document.getElementById('outflow-items');

      leftTotalEl.textContent = 'Loading…';
      leftMetaEl.textContent = '';
      incomeTotalEl.textContent = 'Loading…';
      outflowTotalEl.textContent = 'Loading…';

      try {
        const cacheBust = forceFresh ? `&fresh=${Date.now()}` : '';
        const res = await fetch(`/api/cashflow-summary?month=${encodeURIComponent(month)}${cacheBust}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        lastSummary = data;
        renderLeftToSpend();

        incomeTotalEl.textContent = formatIDR(data.income);
        incomeItemsEl.innerHTML = data.incomeItems.length
          ? data.incomeItems.map((i) => `<li><span>${i.name}</span><span>${formatIDR(i.amount)}</span></li>`).join('')
          : '<li><span class="sub">No income logged.</span></li>';

        outflowTotalEl.textContent = formatIDR(data.outflow);
        const paidPct = data.outflow ? (data.paid / data.outflow) * 100 : 0;
        const billedPct = data.outflow ? (data.billed / data.outflow) * 100 : 0;
        const unbilledPct = data.outflow ? (data.unbilled / data.outflow) * 100 : 0;
        document.getElementById('bar-paid').style.width = paidPct + '%';
        document.getElementById('bar-billed').style.width = billedPct + '%';
        document.getElementById('bar-unbilled').style.width = unbilledPct + '%';

        const allOutflowItems = data.paidItems.map((i) => ({ ...i, statusKey: 'paid' }))
          .concat(data.billedItems.map((i) => ({ ...i, statusKey: 'billed' })))
          .concat(data.unbilledItems.map((i) => ({ ...i, statusKey: 'unbilled' })));

        const byCategory = {};
        allOutflowItems.forEach((i) => {
          const cat = i.category || 'Uncategorized';
          (byCategory[cat] = byCategory[cat] || []).push(i);
        });

        const categoryOrder = ['Cash', 'Credit Cards'];
        const categories = Object.keys(byCategory).sort((a, b) => {
          const ai = categoryOrder.indexOf(a);
          const bi = categoryOrder.indexOf(b);
          if (ai === -1 && bi === -1) return a.localeCompare(b);
          if (ai === -1) return 1;
          if (bi === -1) return -1;
          return ai - bi;
        });

        outflowItemsEl.innerHTML = categories.length
          ? categories.map((cat) => `
              <li class="category-header">${cat}</li>
              ${byCategory[cat].map((i) => `<li class="${i.statusKey}"><span>${i.name}</span><span>${formatIDR(i.amount)}</span></li>`).join('')}
            `).join('')
          : '<li><span class="sub">No expenses logged.</span></li>';
      } catch (err) {
        leftTotalEl.textContent = '—';
        leftMetaEl.innerHTML = `<span class="error">${err.message}</span>`;
      }
    }

    document.getElementById('month').addEventListener('change', () => loadSummary());
    loadMonths();

    // ---- Credit card float (Float Plan tab) ----
    // Not tied to the month dropdown: it always shows the current card
    // billing month, which the sheet works out itself.
    const FLT_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function fltMonth(key) {
      if (!key) return '';
      const [y, m] = key.split('-');
      return `${FLT_MONTHS[Number(m) - 1]} ${y}`;
    }
    function fltEscape(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function renderFloat(plan) {
      const hero = document.getElementById('flt-hero');
      const heroSub = document.getElementById('flt-hero-sub');
      const body = document.getElementById('flt-body');

      if (!plan.exists) {
        hero.textContent = 'Not set up yet';
        hero.style.color = 'var(--muted)';
        heroSub.innerHTML = 'In the sheet, run <b>Finances › Set Up Float Plan…</b>';
        body.hidden = true;
        return;
      }

      const { now, settings, months } = plan;
      const s = settings;
      const hasCap = typeof now.cap === 'number';

      if (hasCap) {
        const left = typeof now.left === 'number' ? now.left : now.cap - (now.spend || 0);
        hero.textContent = left >= 0 ? `${formatIDR(left)} left` : formatIDR(-left);
        hero.style.color = left >= 0 ? 'var(--accent)' : 'var(--negative)';
        heroSub.textContent = left >= 0 ? "under this month's card cap" : "over this month's card cap";
      } else {
        hero.textContent = now.status || '—';
        hero.style.color = 'var(--muted)';
        heroSub.textContent = s.start ? `Plan starts with the ${fltMonth(s.start)} card month` : '';
      }

      body.hidden = false;
      const spend = now.spend || 0;
      const fill = document.getElementById('flt-bar-fill');
      const pct = hasCap ? (now.cap > 0 ? Math.min(100, (spend / now.cap) * 100) : (spend > 0 ? 100 : 0)) : 0;
      fill.style.width = pct + '%';
      fill.classList.toggle('over', hasCap && spend > now.cap);
      document.getElementById('flt-spent').textContent = `Spent on cards ${formatIDR(spend)}`;
      document.getElementById('flt-cap').textContent = hasCap ? `Cap ${formatIDR(now.cap)}` : '';

      document.getElementById('flt-goal').textContent = s.freeBy
        ? `Float-free by ${fltMonth(s.freeBy)}` + (typeof now.monthsLeft === 'number' ? ` · ${now.monthsLeft} month(s) to go` : '')
        : 'Set a monthly cut in the Float Plan tab (B9)';
      document.getElementById('flt-plan').textContent = (typeof s.baseline === 'number' && typeof s.cut === 'number')
        ? `Baseline ${formatIDR(s.baseline)}/month, cap drops ${formatIDR(s.cut)} each month` +
          (typeof s.customCut === 'number' ? ' (your cut)' : ' (suggested)')
        : '';

      const current = months.find((m) => m.status.startsWith('⏳') || m.status.startsWith('✗ Over cap already'));
      document.getElementById('flt-months').innerHTML = months.length
        ? months.map((m) => {
            const cls = [
              m.status.startsWith('✓') || m.status.startsWith('⏳') ? 'flt-under' : '',
              m.status.startsWith('✗') ? 'flt-over' : '',
              current && m.month === current.month ? 'flt-current' : '',
            ].join(' ');
            const right = typeof m.spend === 'number'
              ? `${formatIDR(m.spend)} / ${formatIDR(m.cap)}`
              : `cap ${formatIDR(m.cap)}`;
            return `<li class="${cls}"><span>${fltMonth(m.month)} <span class="flt-status">${fltEscape(m.status)}</span></span><span>${right}</span></li>`;
          }).join('')
        : '<li><span class="sub">No months yet.</span></li>';
    }

    async function loadFloat(forceFresh) {
      try {
        const cacheBust = forceFresh ? `&fresh=${Date.now()}` : '';
        const res = await fetch(`/api/cashflow-summary?action=float${cacheBust}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        renderFloat(data);
      } catch (err) {
        document.getElementById('flt-hero').textContent = '—';
        document.getElementById('flt-hero-sub').innerHTML = `<span class="error">${fltEscape(err.message)}</span>`;
      }
    }
    loadFloat();

    // Add-only here (no edit/delete) -- once a transaction is actually
    // saved, hand off to the Transactions page so it's visible in the feed.
    TransactionForm.mount(document.getElementById('txf-root'), {
      supportEditDelete: false,
      onSaved: () => { window.location.href = '/transactions'; },
    });

    BottomNav.mount(document.getElementById('bnv-root'), { active: 'home' });
    KeyboardNav.mount();
    PushToggle.mount(document.getElementById('psh-bell'));

    // Quick-add deep link (see issue #30): a Siri Shortcut can ask for just
    // the amount, then open "/?amount=<digits>" -- this opens the Add form
    // pre-filled with that amount and focuses Payee next, so there's nothing
    // left to type except the payee (and account, if it's not already the
    // right default) before Save.
    (function () {
      const params = new URLSearchParams(window.location.search);
      const amountParam = params.get('amount');
      if (amountParam && /^\d+$/.test(amountParam)) {
        TransactionForm.open(null, { prefillAmount: amountParam });
        // Strip the query param so refreshing the page doesn't reopen the form.
        history.replaceState(null, '', window.location.pathname);
      }
    })();
  </script>
</body>
</html>
