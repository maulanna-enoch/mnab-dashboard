<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MNAB</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
<meta name="theme-color" content="#0f1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="MNAB" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<script src="/shared/pwa.js"></script>
<link rel="stylesheet" href="/shared/transaction-form.css" />
<link rel="stylesheet" href="/shared/category-ui.css" />
<link rel="stylesheet" href="/shared/responsive.css" />
<link rel="stylesheet" href="/shared/bottom-nav.css" />
<link rel="stylesheet" href="/shared/push.css" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #f4f4f5;
    --muted: #9ca3af;
    --accent: #22c55e;
    --negative: #e24b4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px calc(140px + env(safe-area-inset-bottom));
  }
  .app-title {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 16px 0 20px;
    text-align: center;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 16px;
    text-align: center;
  }
  /* "Cash Flow" heading row; also holds the Notifications bell (shared/push.js),
     pinned to the content column's right edge so the centered title stays put. */
  .home-heading {
    position: relative;
    width: 100%;
    max-width: var(--page-max-width);
  }
  .home-heading .psh-bell { position: absolute; right: 0; top: -9px; }
  select#month {
    width: 100%;
    max-width: var(--page-max-width);
    background: var(--card);
    color: var(--text);
    border: 1px solid #374151;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .card {
    width: 100%;
    max-width: var(--page-max-width);
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 12px;
    text-align: center;
  }
  .label {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .hero-total {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--accent);
    word-break: break-word;
  }
  .sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 8px;
  }
  .error {
    color: #f87171;
    font-size: 0.9rem;
  }
  .refresh {
    background: none;
    border: 1px solid #374151;
    color: var(--text);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
  }
  details {
    border-top: 1px solid #2a2e37;
    padding-top: 8px;
    text-align: left;
  }
  summary {
    cursor: pointer;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }

  /* ---- WS5: weekly budget hero, adherence strip, debt card (prefix hm-) ---- */
  .hm-hint { font-size: 0.95rem; color: var(--text); margin-top: 6px; }
  .hm-hint strong { font-weight: 600; }
  .hm-week-range { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
  .hm-msg { font-size: 0.85rem; color: var(--muted); }
  .hm-txns { list-style: none; margin: 8px 0 0; padding: 0; }
  .hm-txns li { display: flex; justify-content: space-between; gap: 12px; font-size: 0.85rem; padding: 4px 0; }
  .hm-txns li .hm-txn-payee { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hm-txns li .hm-txn-date { color: var(--muted); font-size: 0.75rem; margin-left: 6px; }
  .hm-txns li .hm-txn-amt { color: var(--muted); white-space: nowrap; }
  .card details { margin-top: 12px; }

  .hm-strip-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .hm-strip-head .label { margin-bottom: 0; }
  .hm-streak { font-size: 0.85rem; color: var(--accent); font-weight: 600; }
  .hm-streak.zero { color: var(--muted); font-weight: 500; }
  .hm-strip {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 72px;
    border-bottom: 1px solid #2a2e37;
  }
  /* The allowance line: a full bar reaches exactly to it. */
  .hm-strip::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    bottom: calc(72px * 0.66);
    border-top: 1px dashed #4b5563;
    pointer-events: none;
  }
  .hm-bar { flex: 1; min-width: 0; border-radius: 3px 3px 0 0; background: #374151; }
  .hm-bar.kept { background: var(--accent); }
  .hm-bar.over { background: var(--negative); }
  .hm-bar.current { opacity: 0.55; }
  .hm-strip-axis { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); margin-top: 4px; }

  .hm-debt-row { display: flex; justify-content: space-between; gap: 12px; text-align: left; padding: 8px 0; border-top: 1px solid #2a2e37; font-size: 0.9rem; }
  .hm-debt-row:first-of-type { border-top: none; }
  .hm-debt-row .hm-k { color: var(--muted); }
  .hm-debt-row .hm-v { text-align: right; font-weight: 600; }
  .hm-later { color: var(--negative); }
  .hm-sooner { color: var(--accent); }
  .hm-big { font-size: 1.8rem; font-weight: 700; }
  .hm-sub-pct { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

  /* ---- WS8: Where it went card (links to /where) ---- */
  a.card { display: block; color: inherit; text-decoration: none; text-align: left; }
  a.card[hidden] { display: none; }
  a.card:hover { background: #1f232b; }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hw-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .hw-head .label { margin-bottom: 0; }
  .hw-open { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 2px; white-space: nowrap; }
  .hw-open svg { width: 14px; height: 14px; }
  .hw-total { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .hw-total strong { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hw-delta { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
  .hw-delta.up { color: #fb923c; }
  .hw-delta.down { color: #4ade80; }
  .hw-stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin-top: 12px; background: #2a2e37; }
  .hw-stack span { display: block; min-width: 3px; }
  .hw-rows { list-style: none; margin: 12px 0 0; padding: 0; }
  .hw-rows li { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 0.88rem; }
  .hw-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .hw-dot.none { border: 1px dashed #6b7280; }
  .hw-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hw-pct { color: var(--muted); font-size: 0.78rem; width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
  .hw-amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 92px; text-align: right; }
  .hw-foot + .hw-foot { margin-top: 2px; }
  .hw-foot { margin-top: 8px; font-size: 0.78rem; color: var(--muted); }
  .hw-foot .hw-uncat { color: #fb923c; }

</style>
</head>
<body>
  <div class="app-title">MNAB · Maulanna Needs A Budget</div>
  <div class="home-heading">
    <h1>This week</h1>
    <button type="button" class="psh-bell" id="psh-bell" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
  </div>

  <!-- WS5 hero: "Left this week" from GET /api/cashflow-summary?action=week (WS4). -->
  <div class="card" id="hm-week-card">
    <div class="label" id="hm-left-label">Left this week</div>
    <div class="hero-total" id="hm-left">Loading…</div>
    <div class="hm-hint" id="hm-perday"></div>
    <div class="hm-week-range" id="hm-week-meta"></div>
    <details id="hm-week-details" hidden>
      <summary id="hm-week-summary">This week's spending</summary>
      <ul class="hm-txns" id="hm-week-txns"></ul>
    </details>
  </div>

  <!-- WS8: Where it went -- this week's spending by category, from the
       week response's `where`. The whole card opens /where. -->
  <a class="card" id="hm-where-card" href="/where" hidden aria-label="Where it went: open the full breakdown">
    <div class="hw-head">
      <div class="label">Where it went</div>
      <span class="hw-open">This week<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
    </div>
    <div id="hw-body"></div>
  </a>

  <!-- Adherence: the last completed weeks against what was available. -->
  <div class="card" id="hm-strip-card" hidden>
    <div class="hm-strip-head">
      <div class="label">Weeks on budget</div>
      <div class="hm-streak" id="hm-streak"></div>
    </div>
    <div class="hm-strip" id="hm-strip" role="img"></div>
    <div class="hm-strip-axis"><span id="hm-strip-from"></span><span>this week</span></div>
    <div class="sub" id="hm-strip-meta"></div>
  </div>

  <!-- Debt: GET /api/cashflow-summary?action=debt (WS6). -->
  <div class="card" id="hm-debt-card">
    <div class="label">Owed to the future</div>
    <div class="hm-big" id="hm-hole">Loading…</div>
    <div class="hm-sub-pct" id="hm-hole-pct"></div>
    <div id="hm-debt-rows" style="margin-top: 12px;"></div>
    <div class="sub" id="hm-debt-meta"></div>
  </div>

  <button class="refresh" onclick="refreshHome()">Refresh</button>

  <div id="txf-root"></div>
  <div id="bnv-root"></div>

  <script src="/shared/modal-a11y.js"></script>
  <script src="/shared/category-ui.js"></script>
  <script src="/shared/transaction-form.js"></script>
  <script src="/shared/bottom-nav.js"></script>
  <script src="/shared/keyboard-nav.js"></script>
  <script src="/shared/push.js"></script>
  <script>
    function formatIDR(value) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0,
      }).format(value);
    }

    // ---- WS5: weekly budget + debt ----
    // Dates from the API are 'YYYY-MM-DD' calendar dates (Jakarta). Parse
    // them from their parts, never via new Date('YYYY-MM-DD') (that's UTC
    // midnight) or toISOString().
    function parseIsoDay(s) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
      return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
    }
    function shortDay(s) {
      const d = parseIsoDay(s);
      return d ? d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
    }
    function longDay(s) {
      const d = parseIsoDay(s);
      return d ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    }
    function monthName(ym) {
      const m = /^(\d{4})-(\d{2})$/.exec(String(ym || ''));
      if (!m) return '';
      return new Date(Number(m[1]), Number(m[2]) - 1, 1).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function pctLabel(f) {
      return typeof f === 'number' ? `${(f * 100).toFixed(1)}% of salary` : '';
    }
    // "+6 days later" / "4 days sooner" / "no change", with a colour class.
    function daysMoved(n) {
      if (typeof n !== 'number') return { text: '—', cls: '' };
      if (n === 0) return { text: 'no change', cls: '' };
      const abs = Math.abs(n);
      const unit = abs === 1 ? 'day' : 'days';
      return n > 0 ? { text: `+${abs} ${unit} later`, cls: 'hm-later' } : { text: `${abs} ${unit} sooner`, cls: 'hm-sooner' };
    }

    function renderWeek(data) {
      const w = data.week;
      const leftEl = document.getElementById('hm-left');
      const perDayEl = document.getElementById('hm-perday');
      const metaEl = document.getElementById('hm-week-meta');
      const range = `${shortDay(w.start)} – ${shortDay(w.end)}`;

      if (w.left === null || w.left === undefined) {
        document.getElementById('hm-left-label').textContent = 'Spent this week';
        leftEl.textContent = formatIDR(w.spent);
        leftEl.style.color = 'var(--text)';
        perDayEl.innerHTML = '<span class="hm-msg">Set <code>weekly_allowance_rp</code> in the Settings tab to see what\'s left.</span>';
        metaEl.textContent = range;
      } else {
        document.getElementById('hm-left-label').textContent = 'Left this week';
        leftEl.textContent = formatIDR(w.left);
        leftEl.style.color = w.left >= 0 ? 'var(--accent)' : 'var(--negative)';
        const days = w.daysLeft === 1 ? 'today only' : `${w.daysLeft} days left`;
        perDayEl.innerHTML = w.left > 0
          ? `≈ <strong>${formatIDR(w.perDay)}</strong> / day · ${days}`
          : (w.left === 0 ? `Nothing left · ${days}` : `Over by <strong>${formatIDR(-w.left)}</strong> · ${days}`);
        const carry = w.carryIn ? ` · ${w.carryIn > 0 ? '+' : '−'}${formatIDR(Math.abs(w.carryIn))} rolled over` : '';
        metaEl.textContent = `${range} · spent ${formatIDR(w.spent)} of ${formatIDR(w.available)}${carry}`;
      }

      const txns = w.transactions || [];
      const det = document.getElementById('hm-week-details');
      det.hidden = txns.length === 0;
      document.getElementById('hm-week-summary').textContent =
        `This week's spending (${txns.length} transaction${txns.length === 1 ? '' : 's'})`;
      document.getElementById('hm-week-txns').innerHTML = txns.map((t) => `
        <li><span class="hm-txn-payee">${escapeHtml(t.payee || '(no payee)')}<span class="hm-txn-date">${escapeHtml(shortDay(t.date))}</span></span>
        <span class="hm-txn-amt">${formatIDR(t.amount)}</span></li>`).join('');

      renderStrip(data);
      // Colours come from the Categories tab; draw once they're in (the
      // card still draws with fallback colours if that request fails).
      CategoryUI.load().catch(() => null).then(() => renderWhere(data.where));
    }

    // Last completed weeks (oldest first) plus the current one, as bars of
    // spent / available. The dashed line is 100% of what was available; a
    // bar is capped at 1.5x so one bad week doesn't flatten the rest.
    const STRIP_CAP = 1.5;
    function renderStrip(data) {
      const card = document.getElementById('hm-strip-card');
      const weeks = (data.history || []).filter((h) => !h.beforeBudgetStart && typeof h.available === 'number');
      if (data.week.available === null || data.week.available === undefined || !weeks.length) {
        card.hidden = true;
        return;
      }
      card.hidden = false;
      const all = weeks.concat([{ ...data.week, current: true }]);
      const strip = document.getElementById('hm-strip');
      strip.innerHTML = all.map((w) => {
        const ratio = w.available > 0 ? w.spent / w.available : (w.spent > 0 ? STRIP_CAP : 0);
        const h = Math.max(3, Math.min(STRIP_CAP, ratio) / STRIP_CAP * 100);
        const cls = w.current ? (w.left >= 0 ? 'kept current' : 'over current') : (w.kept ? 'kept' : 'over');
        const title = `${shortDay(w.start)}: spent ${formatIDR(w.spent)} of ${formatIDR(w.available)}${w.current ? ' (so far)' : ''}`;
        return `<div class="hm-bar ${cls}" style="height:${h.toFixed(1)}%" title="${escapeHtml(title)}"></div>`;
      }).join('');
      const keptCount = weeks.filter((w) => w.kept).length;
      strip.setAttribute('aria-label', `${keptCount} of the last ${weeks.length} weeks kept to budget`);
      document.getElementById('hm-strip-from').textContent = shortDay(weeks[0].start);
      const streakEl = document.getElementById('hm-streak');
      streakEl.textContent = data.streak > 0 ? `${data.streak}-week streak` : 'No streak yet';
      streakEl.classList.toggle('zero', !(data.streak > 0));
      document.getElementById('hm-strip-meta').textContent = `${keptCount} of the last ${weeks.length} week${weeks.length === 1 ? '' : 's'} on budget`;
    }


    // ---- WS8: Where it went card ----
    // Top categories this week (biggest first, Uncategorised folded into
    // the footer), a stacked bar of all of them, and the change against the
    // same point last week.
    const HW_TOP = 3;
    function renderWhere(where) {
      const card = document.getElementById('hm-where-card');
      const body = document.getElementById('hw-body');
      if (!where) { card.hidden = true; return; }
      card.hidden = false;
      const cats = where.categories || [];
      const total = where.total || 0;
      if (!total) {
        body.innerHTML = '<div class="hw-foot" style="margin-top:10px">Nothing spent yet this week. Tap to see past weeks and months.</div>';
        return;
      }
      const colourOf = (name) => (name === CategoryUI.UNCATEGORISED ? null : CategoryUI.colourFor(name));
      const fillOf = (name) => colourOf(name) || '#4b5563';
      const named = cats.filter((c) => c.name !== CategoryUI.UNCATEGORISED);
      const uncat = cats.find((c) => c.name === CategoryUI.UNCATEGORISED);
      const top = named.slice(0, HW_TOP);
      const restAmt = named.slice(HW_TOP).reduce((s, c) => s + c.amount, 0);
      const restN = named.length - top.length;

      const prev = where.compare ? where.compare.total : 0;
      let delta = '';
      if (prev) {
        const pct = Math.round(((total - prev) / prev) * 100);
        delta = pct === 0
          ? '<span class="hw-delta">same as last week so far</span>'
          : `<span class="hw-delta ${pct > 0 ? 'up' : 'down'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct)}% vs same point last week</span>`;
      }

      const row = (name, amt, dotStyle) => `<li><span class="hw-dot${dotStyle ? '' : ' none'}"${dotStyle ? ` style="background:${escapeHtml(dotStyle)}"` : ''}></span>` +
        `<span class="hw-name">${escapeHtml(name)}</span><span class="hw-pct">${Math.round((amt / total) * 100)}%</span>` +
        `<span class="hw-amt">${formatIDR(amt)}</span></li>`;
      const rows = top.map((c) => row(c.name, c.amount, colourOf(c.name)));
      if (restN > 0) rows.push(row(`${restN} other categor${restN === 1 ? 'y' : 'ies'}`, restAmt, '#4b5563'));

      const biggest = (where.payees || [])[0];
      const foot = [];
      if (biggest) foot.push(`Biggest payee: ${escapeHtml(biggest.name)} ${formatIDR(biggest.amount)}`);
      if (uncat && uncat.amount) foot.push(`<span class="hw-uncat">${formatIDR(uncat.amount)} has no category yet</span>`);

      body.innerHTML = `
        <div class="hw-total"><strong>${formatIDR(total)}</strong>${delta}</div>
        <div class="hw-stack" role="img" aria-label="Share of this week's spending by category">${
          cats.map((c) => `<span style="flex:${c.amount} 1 0;background:${escapeHtml(fillOf(c.name))}"></span>`).join('')}</div>
        <ul class="hw-rows">${rows.join('')}</ul>
        ${foot.map((f) => `<div class="hw-foot">${f}</div>`).join('')}`;
      card.setAttribute('aria-label', `Where it went this week: ${formatIDR(total)}${top[0] ? `, most on ${top[0].name}` : ''}. Open the full breakdown.`);
    }

    function renderDebt(data) {
      const holeEl = document.getElementById('hm-hole');
      const pctEl = document.getElementById('hm-hole-pct');
      const rowsEl = document.getElementById('hm-debt-rows');
      const metaEl = document.getElementById('hm-debt-meta');
      const warnings = (data.warnings || []).concat(data.settingsWarnings || []);

      if (!data.hole) {
        holeEl.textContent = '—';
        pctEl.textContent = '';
        rowsEl.innerHTML = '';
        metaEl.innerHTML = `<span class="hm-msg">${escapeHtml(warnings[0] || 'No Steals data.')}</span>`;
        return;
      }
      holeEl.textContent = formatIDR(data.hole.amount);
      holeEl.style.color = data.hole.amount > 0 ? 'var(--negative)' : 'var(--accent)';
      pctEl.textContent = pctLabel(data.hole.pctOfSalary);

      const rows = [];
      if (data.plan) {
        const free = data.plan.debtFreeMonth
          ? (data.hole.amount > 0 && data.plan.estimatedDate ? `~${longDay(data.plan.estimatedDate)}` : monthName(data.plan.debtFreeMonth))
          : `Not by ${monthName(data.inputs && data.inputs.horizonEnd)}`;
        rows.push(['Debt-free (on plan)', escapeHtml(free), '']);
        if (data.lastWeek) {
          const mv = daysMoved(data.lastWeek.movedDays);
          const dev = data.lastWeek.deviation;
          const why = dev > 0 ? `${formatIDR(dev)} over` : (dev < 0 ? `${formatIDR(-dev)} under` : 'on budget');
          rows.push([`Last week (${why} allowance)`, mv.text, mv.cls]);
        }
        if (data.pace && data.pace.weeks) {
          const mv = daysMoved(data.pace.daysVsPlan);
          const when = data.pace.debtFreeMonth ? monthName(data.pace.debtFreeMonth) : 'not in sight';
          rows.push([`At your ${data.pace.weeks}-week pace`, `${escapeHtml(when)}${data.pace.daysVsPlan ? ` <span class="${mv.cls}">(${mv.text})</span>` : ''}`, '']);
        }
        if (data.plan.peakAfterThr && data.plan.peakAfterThr.amount > data.hole.amount) {
          rows.push([`Peaks ${monthName(data.plan.peakAfterThr.month)}`, escapeHtml(pctLabel(data.plan.peakAfterThr.pct) || formatIDR(data.plan.peakAfterThr.amount)), '']);
        }
      }
      rowsEl.innerHTML = rows.map(([k, v, cls]) =>
        `<div class="hm-debt-row"><span class="hm-k">${escapeHtml(k)}</span><span class="hm-v ${cls}">${v}</span></div>`).join('');
      metaEl.innerHTML = !data.plan && warnings.length
        ? `<span class="hm-msg">${escapeHtml(warnings.find((w) => /not set/.test(w)) || warnings[0])}</span>`
        : '';
    }

    async function getJson(url) {
      const res = await fetch(url, { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    async function loadWeek() {
      try {
        renderWeek(await getJson('/api/cashflow-summary?action=week'));
      } catch (err) {
        document.getElementById('hm-left').textContent = '—';
        document.getElementById('hm-perday').innerHTML = `<span class="error">${escapeHtml(err.message)}</span>`;
      }
    }

    async function loadDebt() {
      try {
        renderDebt(await getJson('/api/cashflow-summary?action=debt&rows=0'));
      } catch (err) {
        document.getElementById('hm-hole').textContent = '—';
        document.getElementById('hm-debt-meta').innerHTML = `<span class="error">${escapeHtml(err.message)}</span>`;
      }
    }

    function refreshHome() {
      loadWeek();
      loadDebt();
    }

    loadWeek();
    loadDebt();

    // Add-only here (no edit/delete) -- once a transaction is actually
    // saved, hand off to the Transactions page so it's visible in the feed.
    TransactionForm.mount(document.getElementById('txf-root'), {
      supportEditDelete: false,
      onSaved: () => { window.location.href = '/transactions'; },
    });

    BottomNav.mount(document.getElementById('bnv-root'), { active: 'home' });
    KeyboardNav.mount();
    PushToggle.mount(document.getElementById('psh-bell'));

    // Quick-add deep link (see issue #30): a Siri Shortcut can ask for just
    // the amount, then open "/?amount=<digits>" -- this opens the Add form
    // pre-filled with that amount and focuses Payee next, so there's nothing
    // left to type except the payee (and account, if it's not already the
    // right default) before Save.
    (function () {
      const params = new URLSearchParams(window.location.search);
      const amountParam = params.get('amount');
      if (amountParam && /^\d+$/.test(amountParam)) {
        TransactionForm.open(null, { prefillAmount: amountParam });
        // Strip the query param so refreshing the page doesn't reopen the form.
        history.replaceState(null, '', window.location.pathname);
      }
    })();
  </script>
</body>
</html>
