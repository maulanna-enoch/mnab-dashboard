<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MNAB</title>
<link rel="stylesheet" href="/shared/transaction-form.css" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #f4f4f5;
    --muted: #9ca3af;
    --accent: #22c55e;
    --negative: #e24b4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 100px;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0 0 32px;
    text-align: center;
  }
  nav {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  nav a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    border-radius: 16px;
    padding: 20px 24px;
    font-size: 1rem;
    font-weight: 500;
  }
  nav a .chevron {
    color: var(--muted);
  }
</style>
</head>
<body>
  <h1>MNAB · Maulanna Needs A Budget</h1>
  <nav>
    <a href="/cashflow">
      <span>Cash Flow</span>
      <span class="chevron">›</span>
    </a>
    <a href="/installments">
      <span>Installments &amp; Bills</span>
      <span class="chevron">›</span>
    </a>
    <a href="/transactions">
      <span>Transactions</span>
      <span class="chevron">›</span>
    </a>
  </nav>

  <div id="txf-root"></div>

  <script src="/shared/transaction-form.js"></script>
  <script>
    // Add-only here (no edit/delete) -- once a transaction is actually
    // saved, hand off to the Transactions page so it's visible in the feed.
    TransactionForm.mount(document.getElementById('txf-root'), {
      supportEditDelete: false,
      onSaved: () => { window.location.href = '/transactions'; },
    });
  </script>
</body>
</html>
