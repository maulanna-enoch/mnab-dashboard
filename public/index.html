<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MNAB</title>
<link rel="stylesheet" href="/shared/transaction-form.css" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #f4f4f5;
    --muted: #9ca3af;
    --accent: #22c55e;
    --negative: #e24b4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 100px;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0 0 32px;
    text-align: center;
  }
  nav {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  nav a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    border-radius: 16px;
    padding: 20px 24px;
    font-size: 1rem;
    font-weight: 500;
  }
  nav a .chevron {
    color: var(--muted);
  }
  nav a.new-item {
    border: 1px dashed rgba(34,197,94,0.5);
    background: rgba(34,197,94,0.06);
  }
  .new-tag {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 1px 7px;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>
  <h1>MNAB · Maulanna Needs A Budget</h1>
  <nav>
    <a href="/cashflow">
      <span>Cash Flow</span>
      <span class="chevron">›</span>
    </a>
    <a href="/installments">
      <span>Installments &amp; Bills</span>
      <span class="chevron">›</span>
    </a>
    <a href="/transactions">
      <span>Transactions</span>
      <span class="chevron">›</span>
    </a>
    <a href="/accounts" class="new-item">
      <span>Accounts<span class="new-tag">New</span></span>
      <span class="chevron">›</span>
    </a>
  </nav>

  <div id="txf-root"></div>

  <script src="/shared/transaction-form.js"></script>
  <script>
    // Add-only here (no edit/delete) -- once a transaction is actually
    // saved, hand off to the Transactions page so it's visible in the feed.
    TransactionForm.mount(document.getElementById('txf-root'), {
      supportEditDelete: false,
      onSaved: () => { window.location.href = '/transactions'; },
    });

    // Quick-add deep link (see issue #30): a Siri Shortcut can ask for just
    // the amount, then open "/?amount=<digits>" -- this opens the Add form
    // pre-filled with that amount and focuses Payee next, so there's nothing
    // left to type except the payee (and account, if it's not already the
    // right default) before Save.
    (function () {
      const params = new URLSearchParams(window.location.search);
      const amountParam = params.get('amount');
      if (amountParam && /^\d+$/.test(amountParam)) {
        TransactionForm.open(null, { prefillAmount: amountParam });
        // Strip the query param so refreshing the page doesn't reopen the form.
        history.replaceState(null, '', window.location.pathname);
      }
    })();
  </script>
</body>
</html>
