<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MNAB Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #f4f4f5;
    --muted: #9ca3af;
    --accent: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 24px;
    text-align: center;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .label {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .total {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--accent);
    word-break: break-word;
  }
  .sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 8px;
  }
  .error {
    color: #f87171;
    font-size: 0.9rem;
  }
  .refresh {
    background: none;
    border: 1px solid #374151;
    color: var(--text);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <h1>MNAB · Active Installments</h1>
  <div class="card">
    <div class="label">Total (active)</div>
    <div class="total" id="total">Loading…</div>
    <div class="sub" id="meta"></div>
  </div>
  <button class="refresh" onclick="load()">Refresh</button>

  <script>
    function formatIDR(value) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0,
      }).format(value);
    }

    async function load() {
      const totalEl = document.getElementById('total');
      const metaEl = document.getElementById('meta');
      totalEl.textContent = 'Loading…';
      metaEl.textContent = '';
      try {
        const res = await fetch('/api/installments-summary');
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        totalEl.textContent = formatIDR(data.total);
        metaEl.textContent = `${data.activeCount} active items · updated ${new Date(data.updatedAt).toLocaleTimeString()}`;
      } catch (err) {
        totalEl.textContent = '—';
        metaEl.innerHTML = `<span class="error">${err.message}</span>`;
      }
    }

    load();
  </script>
</body>
</html>
