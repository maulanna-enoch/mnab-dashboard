<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Installments & Bills · MNAB</title>
<link rel="stylesheet" href="/shared/bottom-nav.css" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #f4f4f5;
    --muted: #9ca3af;
    --accent: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px calc(140px + env(safe-area-inset-bottom));
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 24px;
    text-align: center;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .label {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .total {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--text);
    word-break: break-word;
  }
  .sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 8px;
  }
  .error {
    color: #f87171;
    font-size: 0.9rem;
  }
  .refresh {
    background: none;
    border: 1px solid #374151;
    color: var(--text);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
  }
  .wide {
    text-align: left;
  }
  .wide .label {
    text-align: center;
  }
  .section-total {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
    text-align: center;
    margin-bottom: 4px;
  }
  .section-meta {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 12px;
  }
  .month-row {
    border-bottom: 1px solid #2a2e37;
  }
  .month-row:last-child {
    border-bottom: none;
  }
  .month-row summary {
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    cursor: pointer;
  }
  .month-row summary::-webkit-details-marker {
    display: none;
  }
  .month-name {
    font-weight: 600;
  }
  .month-count {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 400;
  }
  .month-amount {
    color: var(--text);
    font-weight: 600;
  }
  .month-detail {
    padding: 0 0 14px;
  }
  .month-detail .remaining {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .item-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .item-list li {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    padding: 4px 0;
    color: var(--text);
  }
  .item-list li span:last-child {
    color: var(--text);
  }
  .no-end {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 8px;
  }
</style>
</head>
<body>
  <h1>Installments & Bills</h1>

  <div class="card">
    <div class="label">Total Active (Installments + Bills)</div>
    <div class="total" id="hero-total">Loading…</div>
    <div class="sub" id="hero-meta"></div>
  </div>

  <div class="card wide">
    <div class="label">Active Installments</div>
    <div class="section-total" id="installments-total">Loading…</div>
    <div class="section-meta" id="installments-meta"></div>
    <div id="months-list">Loading…</div>
    <div class="no-end" id="no-end"></div>
  </div>

  <div class="card wide">
    <div class="label">Recurring Bills (active)</div>
    <div class="section-total" id="bills-total">Loading…</div>
    <ul class="item-list" id="bills-list"></ul>
  </div>

  <button class="refresh" onclick="load()">Refresh</button>

  <div id="bnv-root"></div>

  <script src="/shared/bottom-nav.js"></script>
  <script src="/shared/keyboard-nav.js"></script>
  <script>
    BottomNav.mount(document.getElementById('bnv-root'), { active: 'bills' });
    KeyboardNav.mount();
  </script>
  <script>
    function formatIDR(value) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0,
      }).format(value);
    }

    function renderMonths(monthsData) {
      const monthsEl = document.getElementById('months-list');
      const noEndEl = document.getElementById('no-end');

      if (!monthsData.months.length) {
        monthsEl.innerHTML = '<div class="sub">No active installments with an end date.</div>';
      } else {
        monthsEl.innerHTML = monthsData.months.map((m) => `
          <details class="month-row">
            <summary>
              <span>
                <span class="month-name">${m.label}</span>
                <span class="month-count">(${m.count})</span>
              </span>
              <span class="month-amount">${formatIDR(m.amountEnding)}</span>
            </summary>
            <div class="month-detail">
              <div class="remaining">Remaining after: ${formatIDR(m.remainingAfter)}</div>
              <ul class="item-list">
                ${m.items.map((i) => `<li><span>${i.name}</span><span>${formatIDR(i.amount)}</span></li>`).join('')}
              </ul>
            </div>
          </details>
        `).join('');
      }

      noEndEl.textContent = (monthsData.noEndDate && monthsData.noEndDate.count > 0)
        ? `+ ${monthsData.noEndDate.count} active item(s) with no end date (${formatIDR(monthsData.noEndDate.amount)}) not shown above.`
        : '';
    }

    function renderBills(billsData) {
      const totalEl = document.getElementById('bills-total');
      const listEl = document.getElementById('bills-list');
      totalEl.textContent = formatIDR(billsData.total);
      listEl.innerHTML = billsData.count
        ? billsData.items.map((i) => `<li><span>${i.name}</span><span>${formatIDR(i.amount)}</span></li>`).join('')
        : '<li><span class="sub">No active bills.</span></li>';
    }

    async function load() {
      const heroTotalEl = document.getElementById('hero-total');
      const heroMetaEl = document.getElementById('hero-meta');
      const instTotalEl = document.getElementById('installments-total');
      const instMetaEl = document.getElementById('installments-meta');

      heroTotalEl.textContent = 'Loading…';
      heroMetaEl.textContent = '';
      instTotalEl.textContent = 'Loading…';
      instMetaEl.textContent = '';
      document.getElementById('months-list').textContent = 'Loading…';
      document.getElementById('bills-total').textContent = 'Loading…';
      document.getElementById('bills-list').innerHTML = '';

      try {
        const [installments, bills, byMonth] = await Promise.all([
          fetch('/api/installments-summary').then((r) => r.json()),
          fetch('/api/bills-summary').then((r) => r.json()),
          fetch('/api/installments-by-end-month').then((r) => r.json()),
        ]);

        const firstError = installments.error || bills.error || byMonth.error;
        if (firstError) throw new Error(firstError);

        const heroTotal = installments.total + bills.total;
        heroTotalEl.textContent = formatIDR(heroTotal);
        heroMetaEl.textContent = `${installments.activeCount} installments + ${bills.count} bills · updated ${new Date().toLocaleTimeString()}`;

        instTotalEl.textContent = formatIDR(installments.total);
        instMetaEl.textContent = `${installments.activeCount} active installments`;

        renderMonths(byMonth);
        renderBills(bills);
      } catch (err) {
        heroTotalEl.textContent = '—';
        heroMetaEl.innerHTML = `<span class="error">${err.message}</span>`;
      }
    }

    load();
  </script>
</body>
</html>
